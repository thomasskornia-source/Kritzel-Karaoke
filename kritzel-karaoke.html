<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kritzel-Karaoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f2ece2;
    --paper:#0a0a0a;
    --paper-deep:#050505;
    --pen:#e6392b;
    --pen-dim:#7a1f18;
    --muted:#7a756c;
    --line:#2a2825;
    --gold:#c9a227;
    --good:#5fae82;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    padding:14px 14px 10px;
  }
  .wrap{width:100%;max-width:620px;height:100%;display:flex;flex-direction:column;}
  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(28px, 8vw, 44px);
    color:var(--pen);
    margin:0 0 1px;
    line-height:0.95;
  }
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px;}

  .name-row{
    display:flex;gap:8px;align-items:center;margin-bottom:10px;
  }
  .name-row input{
    flex:1;background:transparent;border:1px solid var(--line);
    color:var(--ink);padding:8px 10px;border-radius:6px;
    font-family:inherit;font-size:16px;
  }
  .name-row input:focus{outline:none;border-color:var(--pen-dim);}
  .name-row input:disabled{opacity:.6;}
  .start-btn{
    background:var(--pen);color:#0a0a0a;border:none;
    padding:8px 14px;border-radius:6px;font-weight:600;
    font-family:inherit;font-size:13px;cursor:pointer;
    white-space:nowrap;
  }
  .start-btn:disabled{opacity:.4;cursor:not-allowed;}

  .fs-btn{
    position:fixed;top:14px;right:14px;
    width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,0.55);border:1px solid var(--line);
    color:var(--ink);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:50;
  }
  .fs-btn:hover{border-color:var(--muted);}
  .fs-note{
    position:fixed;top:58px;right:14px;max-width:220px;
    background:rgba(0,0,0,0.85);border:1px solid var(--line);
    color:var(--muted);font-size:12px;padding:8px 10px;
    border-radius:6px;z-index:50;display:none;text-align:right;
  }
  .err-banner{
    position:fixed;left:12px;right:12px;bottom:12px;
    background:#3a0f0c;border:1px solid var(--pen);
    color:#ffd9d4;font-size:12px;padding:10px 12px;
    border-radius:8px;z-index:100;display:none;
    white-space:pre-wrap;word-break:break-word;
  }

  .hud{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:6px;font-size:12px;color:var(--muted);
  }
  .hud b{color:var(--ink);}

  .game-area{display:flex;flex-direction:column;min-height:0;flex:1;}

  .stage{
    position:relative;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:10px;
    aspect-ratio:4/5;
    max-height:36vh;
    margin:0 auto;
    overflow:hidden;
    flex-shrink:1;
  }
  canvas{width:100%;height:100%;display:block;}

  .progress{
    height:3px;background:var(--line);border-radius:2px;
    margin:8px 0 10px;overflow:hidden;flex-shrink:0;
  }
  .progress i{
    display:block;height:100%;width:100%;
    background:var(--pen);
    transform-origin:left;
    transform:scaleX(1);
  }

  .options{
    display:grid;grid-template-columns:1fr 1fr;gap:7px;flex-shrink:0;
  }
  .opt{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 9px;
    border-radius:7px;
    font-family:inherit;font-size:11.5px;
    text-align:left;cursor:pointer;
    transition:border-color .15s, background .15s, opacity .3s, transform .3s;
  }
  .opt:hover{border-color:var(--muted);}
  .opt.locked{opacity:.45;pointer-events:none;}
  .opt.eliminated{opacity:0;transform:scale(.92);pointer-events:none;}
  .opt.correct{border-color:var(--good);background:rgba(95,174,130,0.08);}
  .opt.wrong{border-color:var(--pen);background:rgba(230,57,43,0.08);}

  .result{
    margin-top:16px;padding:14px 16px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;display:none;
  }
  .result a{color:var(--pen);text-decoration:none;border-bottom:1px solid var(--pen-dim);}
  .result .verdict{font-family:'Caveat',cursive;font-size:26px;margin-bottom:4px;display:block;}

  .next-btn{
    margin-top:14px;width:100%;
    background:var(--pen);color:#0a0a0a;border:none;
    padding:13px;border-radius:8px;font-weight:600;
    font-family:inherit;font-size:15px;cursor:pointer;
    display:none;
  }

  .final{display:none;text-align:center;padding:30px 10px;}
  .final .score{font-family:'Caveat',cursive;font-size:64px;color:var(--pen);line-height:1;}
  .final p{color:var(--muted);font-size:14px;}
  .save-btn{
    background:var(--pen);color:#0a0a0a;border:none;
    padding:12px 22px;border-radius:8px;font-weight:600;
    font-family:inherit;cursor:pointer;margin-top:6px;
  }
  .restart-btn{
    background:transparent;color:var(--ink);border:1px solid var(--line);
    padding:12px 22px;border-radius:8px;font-family:inherit;
    cursor:pointer;margin-top:10px;margin-left:8px;
  }

  .board{
    margin-top:34px;border-top:1px solid var(--line);padding-top:18px;
  }
  .board h2{
    font-family:'Caveat',cursive;font-weight:700;color:var(--gold);
    font-size:26px;margin:0 0 10px;
  }
  .board ol{list-style:none;margin:0;padding:0;counter-reset:rank;}
  .board li{
    counter-increment:rank;
    display:flex;justify-content:space-between;
    padding:8px 4px;font-size:14px;
    border-bottom:1px solid var(--line);
  }
  .board li::before{
    content:counter(rank)".";
    color:var(--muted);width:22px;display:inline-block;
  }
  .board li b{margin-left:6px;}
  .board .score-val{color:var(--gold);}
  .board .empty{color:var(--muted);font-size:13px;padding:6px 4px;}

  @media (max-width:400px){
    body{padding:18px 12px 40px;}
    h1{font-size:42px;}
    .opt{font-size:11.5px;padding:9px 9px;}
    .options{gap:7px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Kritzel-Karaoke</h1>
  <div class="sub">Errate den Song, bevor die Zeit um ist.</div>

  <div class="name-row">
    <input id="playerName" type="text" placeholder="Dein Spielername" maxlength="24">
    <button class="start-btn" id="startGameBtn">Los geht's</button>
  </div>

  <button class="fs-btn" id="fsBtn" title="Vollbild">⛶</button>
  <div class="fs-note" id="fsNote">Vollbild wird von diesem Browser/Fenster nicht unterstützt.</div>
  <div class="err-banner" id="errBanner"></div>

  <div class="game-area" id="gameArea" style="display:none;">
  <div class="hud">
    <span>Runde <b id="roundNum">1</b>/5</span>
    <span>Punkte: <b id="scoreVal">0</b></span>
  </div>

  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>

  <div class="progress"><i id="progressBar"></i></div>

  <div class="options" id="options"></div>

  <div class="result" id="result">
    <span class="verdict" id="verdict"></span>
    <span id="resultText"></span>
  </div>

  <button class="next-btn" id="nextBtn">Nächste Runde</button>
  </div>

  <div class="final" id="final">
    <div class="score" id="finalScore">0</div>
    <p>Punkte erreicht — trag dich ins Leaderboard ein</p>
    <button class="save-btn" id="saveBtn">Im Leaderboard speichern</button>
    <button class="restart-btn" id="restartBtn">Nochmal spielen</button>
  </div>

  <div class="board">
    <h2>Top 10</h2>
    <ol id="boardList"></ol>
  </div>

</div>

<script>
window.leaderboardReady = new Promise((resolve) => { window.__resolveLeaderboard = resolve; });

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('Leaderboard-Verbindung dauert zu lange / nicht erreichbar (evtl. in dieser Vorschau blockiert — im echten Browser öffnen)')), ms))
  ]);
}

window.addEventListener('error', (e) => {
  const b = document.getElementById('errBanner');
  if(b){
    b.style.display = 'block';
    b.textContent = 'Fehler: ' + e.message + ' (Zeile ' + e.lineno + ')';
  }
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function densify(verts, res){
  res = res || 8;
  const out = [];
  for(let i=0;i<verts.length-1;i++){
    const x1=verts[i][0], y1=verts[i][1], x2=verts[i+1][0], y2=verts[i+1][1];
    for(let j=0;j<res;j++){
      const t = j/res;
      out.push([x1+(x2-x1)*t, y1+(y2-y1)*t]);
    }
  }
  out.push(verts[verts.length-1]);
  return out;
}

function circleVerts(cx,cy,r,n){
  const out = [];
  for(let i=0;i<=n;i++){
    const t = (i===n) ? 0 : (i/n)*Math.PI*2;
    out.push([cx+r*Math.cos(t), cy+r*Math.sin(t)]);
  }
  return out;
}

function arcVerts(cx,cy,r,a0,a1,n){
  const out = [];
  for(let i=0;i<=n;i++){
    const t = a0+(a1-a0)*(i/n);
    out.push([cx+r*Math.cos(t), cy+r*Math.sin(t)]);
  }
  return out;
}

// A true parametric heart curve (Wolfram MathWorld formula), normalized
// into 0-1 icon space — much smoother and more recognizable than a
// hand-picked polygon.
function heartVerts(cx,cy,r,n){
  const out = [];
  for(let i=0;i<=n;i++){
    const t = (i===n) ? 0 : (i/n)*Math.PI*2;
    const xr = Math.pow(Math.sin(t),3);
    const yr = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))/17;
    out.push([cx+xr*r, cy-yr*r]);
  }
  return out;
}

function cloudVerts(cx,cy,r,n){
  n = n || 16;
  const out = [];
  for(let i=0;i<=n;i++){
    const t = (i===n) ? 0 : (i/n)*Math.PI*2;
    const bump = 1 + 0.25*Math.sin(t*3);
    out.push([cx+r*bump*Math.cos(t), cy+r*0.6*bump*Math.sin(t)]);
  }
  return out;
}

function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function buildIcon(title){
  const raw = ICON_VERTS[title] || [{ v:[[0.3,0.5],[0.7,0.5]], c:'#c9403a' }];
  return raw.map(seg => ({
    color: seg.c,
    points: densify(seg.v, 14),
    closed: seg.v.length>2 && seg.v[0][0]===seg.v[seg.v.length-1][0] && seg.v[0][1]===seg.v[seg.v.length-1][1]
  }));
}

function generatePath(song, w, h){
  return buildIcon(song.title).map(stroke => ({
    color: stroke.color,
    closed: stroke.closed,
    points: stroke.points.map(v => ({x:v[0]*w, y:v[1]*h}))
  }));
}

function totalPoints(strokes){
  return strokes.reduce((sum, s) => sum + s.points.length, 0);
}

function drawFrame(elapsed){
  const rect = stage.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);
  const frac = Math.min(1, elapsed/DRAW_MS);
  const total = totalPoints(strokes);
  let remaining = Math.max(2, Math.floor(total*frac));
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for(const stroke of strokes){
    if(remaining <= 0) break;
    const pts = stroke.points;
    const n = Math.min(pts.length, remaining);
    if(n >= 2){
      ctx.shadowColor = hexToRgba(stroke.color, 0.5);
      ctx.shadowBlur = 10;
      ctx.strokeStyle = stroke.color;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<n;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      if(stroke.closed && n >= pts.length){
        ctx.shadowBlur = 0;
        ctx.fillStyle = hexToRgba(stroke.color, 0.45);
        ctx.fill();
      }
      // wet-paint dab at the brush tip
      const tip = pts[n-1];
      ctx.shadowBlur = 0;
      ctx.fillStyle = hexToRgba(stroke.color, 0.4);
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 5, 0, Math.PI*2);
      ctx.fill();
    }
    remaining -= pts.length;
  }
}

function loop(ts){
  if(startTime===null) startTime = ts;
  const elapsed = ts - startTime;
  drawFrame(elapsed);
  progressBar.style.transform = `scaleX(${1 - Math.min(1, elapsed/ROUND_MS)})`;
  const segMs = (ROUND_MS - FREE_MS)/5;
  const segIdx = Math.min(eliminationOrder.length, Math.floor(Math.max(0, elapsed-FREE_MS)/segMs));
  while(eliminatedCount < segIdx){
    eliminateNext();
  }
  if(elapsed < ROUND_MS && !locked){
    rafId = requestAnimationFrame(loop);
  } else if(!locked){
    finishRound(null);
  }
}

function eliminateNext(){
  const title = eliminationOrder[eliminatedCount];
  eliminatedCount++;
  const btn = optionButtons[title];
  if(btn){
    btn.classList.add('eliminated');
    setTimeout(() => { if(btn.parentNode) btn.parentNode.removeChild(btn); }, 300);
  }
}

function renderOptions(song){
  optionsEl.innerHTML = '';
  optionButtons = {};
  const distractors = shuffle(SONGS.filter(s => s.title !== song.title)).slice(0,4);
  const opts = shuffle([song, ...distractors]);
  eliminationOrder = shuffle(distractors.map(s => s.title));
  eliminatedCount = 0;
  opts.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `${s.title}<br><span style="color:var(--muted);font-size:12px;">${s.artist}</span>`;
    btn.addEventListener('click', () => finishRound(s, btn));
    optionsEl.appendChild(btn);
    optionButtons[s.title] = btn;
  });
}

function startRound(){
  locked = false;
  startTime = null;
  resultEl.style.display = 'none';
  nextBtn.style.display = 'none';
  progressBar.style.transform = 'scaleX(1)';
  roundNumEl.textContent = roundIdx+1;
  const song = SONGS[order[roundIdx]];
  strokes = generatePath(song, stage.clientWidth, stage.clientHeight);
  renderOptions(song);
  resizeCanvas();
  rafId = requestAnimationFrame(loop);
}

function finishRound(chosen, btnEl){
  if(locked) return;
  locked = true;
  cancelAnimationFrame(rafId);
  const song = SONGS[order[roundIdx]];
  const elapsed = performance.now() - (startTime||performance.now());
  const timeLeftFrac = Math.max(0, 1 - Math.min(1, elapsed/ROUND_MS));
  const correct = chosen && chosen.title === song.title;

  [...optionsEl.children].forEach(b => {
    b.classList.add('locked');
    const label = b.textContent.trim();
    if(label.startsWith(song.title)) b.classList.add('correct');
  });
  if(btnEl && !correct) btnEl.classList.add('wrong');

  let gained = 0;
  if(correct){
    gained = Math.max(15, Math.round(100 * timeLeftFrac));
    score += gained;
  }
  scoreValEl.textContent = score;

  resultEl.style.display = 'block';
  if(chosen === null){
    verdictEl.textContent = 'Zeit um!';
    resultTextEl.innerHTML = `Es war <b>${song.title}</b> von ${song.artist}. `;
  } else if(correct){
    verdictEl.textContent = 'Richtig!';
    resultTextEl.innerHTML = `+${gained} Punkte für <b>${song.title}</b>. `;
  } else {
    verdictEl.textContent = 'Daneben.';
    resultTextEl.innerHTML = `Es war <b>${song.title}</b> von ${song.artist}, nicht ${chosen.title}. `;
  }
  resultTextEl.innerHTML += `<a href="${song.url}" target="_blank" rel="noopener">In Spotify anhören ↗</a>`;

  nextBtn.style.display = 'none';
  setTimeout(goNext, 4000);
}

function goNext(){
  roundIdx++;
  if(roundIdx >= order.length){
    showFinal();
  } else {
    startRound();
  }
}

nextBtn.addEventListener('click', goNext);

function showFinal(){
  document.querySelector('.stage').style.display = 'none';
  document.querySelector('.progress').style.display = 'none';
  optionsEl.style.display = 'none';
  resultEl.style.display = 'none';
  nextBtn.style.display = 'none';
  finalEl.style.display = 'block';
  finalScoreEl.textContent = score;
  document.querySelector('.board').style.display = 'block';
}

async function loadBoard(){
  boardList.innerHTML = '<li class="empty">Lade…</li>';
  try{
    const api = await withTimeout(window.leaderboardReady, 6000);
    const list = await api.getEntries();
    renderBoard(list);
  }catch(e){
    boardList.innerHTML = '<li class="empty">Leaderboard aktuell nicht erreichbar.</li>';
  }
}

function renderBoard(list){
  if(!list.length){
    boardList.innerHTML = '<li class="empty">Noch keine Einträge — sei die/der Erste.</li>';
    return;
  }
  boardList.innerHTML = '';
  list.slice(0,10).forEach(entry => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${entry.name}</span><b class="score-val">${entry.score}</b>`;
    boardList.appendChild(li);
  });
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = (playerNameInput.value || 'Anonym').trim().slice(0,24) || 'Anonym';
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Speichere…';
  try{
    const api = await withTimeout(window.leaderboardReady, 6000);
    let list = [];
    try{
      list = await api.getEntries();
    }catch(e){ list = []; }
    list.push({ name, score, ts: Date.now() });
    list.sort((a,b) => b.score - a.score);
    list = list.slice(0,10);
    await api.saveEntries(list);
    renderBoard(list);
    saveBtn.textContent = 'Gespeichert ✓';
  }catch(e){
    saveBtn.textContent = 'Fehler — nochmal versuchen';
    saveBtn.disabled = false;
  }
});

document.getElementById('restartBtn').addEventListener('click', () => {
  document.querySelector('.stage').style.display = 'block';
  document.querySelector('.progress').style.display = 'block';
  optionsEl.style.display = 'grid';
  finalEl.style.display = 'none';
  document.querySelector('.board').style.display = 'none';
  document.getElementById('saveBtn').disabled = false;
  document.getElementById('saveBtn').textContent = 'Im Leaderboard speichern';
  score = 0;
  roundIdx = 0;
  scoreValEl.textContent = 0;
  order = pickRoundOrder();
  startRound();
});

function pickRoundOrder(){
  // Test hook: append ?test=Titel1,Titel2,... to the URL to force specific
  // songs into the round (handy for checking individual icon redesigns).
  const params = new URLSearchParams(window.location.search);
  const testParam = params.get('test');
  if(testParam){
    const wanted = testParam.split(',').map(s => s.trim().toLowerCase());
    const forced = [];
    wanted.forEach(w => {
      const idx = SONGS.findIndex(s => s.title.toLowerCase() === w);
      if(idx !== -1 && !forced.includes(idx)) forced.push(idx);
    });
    if(forced.length > 0){
      const rest = shuffle(SONGS.map((_,i) => i).filter(i => !forced.includes(i)));
      return forced.concat(rest).slice(0,5);
    }
  }
  return shuffle(SONGS.map((_,i) => i)).slice(0,5);
}

const fsBtn = document.getElementById('fsBtn');
const fsNote = document.getElementById('fsNote');
let fsNoteTimer = null;

function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function showFsNote(){
  fsNote.style.display = 'block';
  clearTimeout(fsNoteTimer);
  fsNoteTimer = setTimeout(() => { fsNote.style.display = 'none'; }, 3200);
}

function updateFsBtn(){
  fsBtn.textContent = isFullscreen() ? '✕' : '⛶';
  fsBtn.title = isFullscreen() ? 'Vollbild verlassen' : 'Vollbild';
}

fsBtn.addEventListener('click', () => {
  if(isFullscreen()){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(ex) ex.call(document);
    return;
  }
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req){
    const result = req.call(el);
    if(result && result.catch) result.catch(() => showFsNote());
  } else {
    showFsNote();
  }
});

document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);
</script>
